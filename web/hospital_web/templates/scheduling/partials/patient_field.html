<label>Пациент</label>
<div style="display:flex; gap:10px; align-items:center;">
  <select name="patient" id="id_patient" style="flex:1;">
    <option value="">---------</option>
    {% for p in patients %}
      <option value="{{ p.id }}" {% if selected_patient_id and p.id|stringformat:"s" == selected_patient_id|stringformat:"s" %}selected{% endif %}>
        {{ p.name }}{% if p.phone %} ({{ p.phone }}){% endif %}
      </option>
    {% endfor %}
  </select>
  <button
    type="button"
    class="btn secondary"
    hx-get="{% url 'patient_quick_add' %}"
    hx-target="#patient-quick-add"
    hx-swap="innerHTML"
    style="white-space:nowrap;"
  >+ Новый пациент</button>
</div>
<div id="patient-quick-add" style="margin-top:10px;"></div>
